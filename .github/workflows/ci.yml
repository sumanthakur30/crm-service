name: crm-service CI

on:
  push:
    branches: [feature/crm-platform-mvp, main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests
        run: mvn -B -DskipITs test
      - name: Verify Flyway migrations present
        run: |
          test -f src/main/resources/db/migration/V1__crm_core.sql
          test -f src/main/resources/db/migration/V9__phase4_enterprise_ai.sql
          test -f src/main/resources/db/migration/V10__pilot_accounts_merge_assignment.sql
