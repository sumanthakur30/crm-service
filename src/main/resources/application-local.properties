spring.datasource.url=${CRM_DB_URL:jdbc:postgresql://localhost:5432/crmdb}
spring.datasource.username=${CRM_DB_USERNAME:crmdb}
spring.datasource.password=${CRM_DB_PASSWORD:crmdb}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

crm.entitlement.enabled=false

# Local smoke: org-wide visibility (set CRM_RECORD_SCOPE_ENABLED=true to test OWN/TEAM)
crm.security.record-scope-enabled=${CRM_RECORD_SCOPE_ENABLED:false}
crm.security.default-scope=ORG

# Opt-in: set CRM_NOTIFICATION_ENABLED=true when notification-service is on :8087
crm.notification.enabled=${CRM_NOTIFICATION_ENABLED:false}
crm.notification.fail-open=true

# Opt-in integrations for local pilot (override via env)
crm.order.enabled=${CRM_ORDER_ENABLED:false}
crm.order.fail-open=true
crm.rule-engine.enabled=${CRM_RULE_ENGINE_ENABLED:false}
crm.rule-engine.fail-open=true
crm.field-force.embed-enabled=${CRM_FF_EMBED_ENABLED:true}
crm.field-force.visit-url-template=${CRM_FF_VISIT_URL:http://localhost:4300/visits?leadId={{leadId}}}
crm.field-force.open-in-new-tab=true

# Local: no Eureka required. Hit CRM on :8095 (crm-ui proxy / GATEWAY_CRM_URI).
# With discovery-service up: set EUREKA_CLIENT_ENABLED=true
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:false}

crm.ai.enabled=true
crm.ai.provider=HEURISTIC
