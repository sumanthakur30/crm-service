spring.application.name=crm-service
server.port=${SERVER_PORT:8095}

spring.config.import=optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_crm

management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]

# Entitlement gates. Local profile disables; enable in shared/prod / pilot-retail.
crm.entitlement.enabled=${CRM_ENTITLEMENT_ENABLED:false}
crm.entitlement.base-url=${CRM_SUBSCRIPTION_BASE_URL:http://localhost:8182}
crm.entitlement.flag=FEATURE_CRM
crm.entitlement.quote-flag=${CRM_ENTITLEMENT_QUOTE_FLAG:FEATURE_CRM_QUOTE}
crm.entitlement.campaign-flag=${CRM_ENTITLEMENT_CAMPAIGN_FLAG:FEATURE_CRM_CAMPAIGN}
crm.entitlement.ai-flag=${CRM_ENTITLEMENT_AI_FLAG:FEATURE_CRM_AI}
crm.entitlement.sequences-flag=${CRM_ENTITLEMENT_SEQUENCES_FLAG:FEATURE_CRM_SEQUENCES}
crm.entitlement.whatsapp-flag=${CRM_ENTITLEMENT_WHATSAPP_FLAG:FEATURE_CRM_WHATSAPP}
crm.entitlement.sms-flag=${CRM_ENTITLEMENT_SMS_FLAG:FEATURE_CRM_SMS}
crm.entitlement.email-flag=${CRM_ENTITLEMENT_EMAIL_FLAG:FEATURE_CRM_EMAIL}
crm.entitlement.approval-flag=${CRM_ENTITLEMENT_APPROVAL_FLAG:FEATURE_CRM_APPROVAL}
crm.entitlement.automation-flag=${CRM_ENTITLEMENT_AUTOMATION_FLAG:FEATURE_CRM_AUTOMATION}
crm.entitlement.api-flag=${CRM_ENTITLEMENT_API_FLAG:FEATURE_CRM_API}
crm.entitlement.cases-flag=${CRM_ENTITLEMENT_CASES_FLAG:FEATURE_CRM_CASES}
crm.entitlement.fail-open=${CRM_ENTITLEMENT_FAIL_OPEN:false}

# CTI / softphone SPI (stub by default — plug real provider later)
crm.cti.enabled=${CRM_CTI_ENABLED:false}
crm.cti.provider=${CRM_CTI_PROVIDER:STUB}

# Quote share via notification-service (EMAIL / WHATSAPP / SMS). Fail-open keeps mark-SENT usable offline.
crm.notification.enabled=${CRM_NOTIFICATION_ENABLED:false}
crm.notification.base-url=${CRM_NOTIFICATION_BASE_URL:http://localhost:8087}
crm.notification.fail-open=${CRM_NOTIFICATION_FAIL_OPEN:true}
crm.notification.quote-whatsapp-template=${CRM_NOTIFY_QUOTE_WA:CRM_QUOTE_WHATSAPP}
crm.notification.quote-email-template=${CRM_NOTIFY_QUOTE_EMAIL:CRM_QUOTE_EMAIL}
crm.notification.quote-sms-template=${CRM_NOTIFY_QUOTE_SMS:CRM_QUOTE_SMS}
crm.notification.sequence-step-template=${CRM_NOTIFY_SEQ_STEP:CRM_SEQ_STEP}

# Quote ACCEPT → order-service (off by default; needs numeric shop + product/customer mapping)
crm.order.enabled=${CRM_ORDER_ENABLED:false}
crm.order.fail-open=${CRM_ORDER_FAIL_OPEN:true}
crm.order.base-url=${CRM_ORDER_BASE_URL:http://localhost:8083}
crm.order.shop-id=${CRM_ORDER_SHOP_ID:}
crm.order.default-customer-id=${CRM_ORDER_DEFAULT_CUSTOMER_ID:}
crm.order.default-product-id=${CRM_ORDER_DEFAULT_PRODUCT_ID:}

# Quote versioning / discount approval gate (header discount % of pre-discount taxable)
crm.quote.discount-approval-enabled=${CRM_QUOTE_DISCOUNT_APPROVAL_ENABLED:true}
crm.quote.discount-approval-threshold-percent=${CRM_QUOTE_DISCOUNT_APPROVAL_PCT:10}

# Optional School rule-engine evaluate on stage change (CRM-local rules always run)
crm.rule-engine.enabled=${CRM_RULE_ENGINE_ENABLED:false}
crm.rule-engine.fail-open=${CRM_RULE_ENGINE_FAIL_OPEN:true}
crm.rule-engine.base-url=${CRM_RULE_ENGINE_BASE_URL:http://localhost:8092}

# Quote payment links — STUB provider builds CRM UI pay URLs. Swap provider later (Razorpay/UPI).
crm.payment.link-base-url=${CRM_PAYMENT_LINK_BASE_URL:http://localhost:4500/pay}
crm.payment.provider=${CRM_PAYMENT_PROVIDER:STUB}

crm.convert.enabled=${CRM_CONVERT_ENABLED:false}
crm.convert.fail-open=${CRM_CONVERT_FAIL_OPEN:true}
# SHOP_CUSTOMER → user-service customers (not shop-service). Default live port 8084.
crm.convert.shop-customer-url=${CRM_CONVERT_SHOP_URL:http://localhost:8084/api/v1/customers/from-crm}
crm.convert.school-inquiry-url=${CRM_CONVERT_SCHOOL_URL:http://localhost:8081/api/v1/inquiries/from-crm}
crm.convert.field-force-url=${CRM_CONVERT_FF_URL:http://localhost:8090/api/v1/leads/from-crm}
# Optional numeric shop org for user-service X-Shop-Id (else inbound X-Shop-Id, else X-Tenant-Id)
crm.convert.shop-id=${CRM_CONVERT_SHOP_ID:}
crm.convert.internal-api-key=${CRM_CONVERT_INTERNAL_API_KEY:}

# Field Force visit embed / deep-link (CRM UI iframe or new tab)
crm.field-force.embed-enabled=${CRM_FF_EMBED_ENABLED:true}
crm.field-force.visit-url-template=${CRM_FF_VISIT_URL:http://localhost:4300/visits?leadId={{leadId}}}
crm.field-force.open-in-new-tab=${CRM_FF_OPEN_NEW_TAB:true}

# Phase 4 AI (heuristic by default; set CRM_AI_PROVIDER=HTTP + CRM_AI_HTTP_URL for LLM bridge)
crm.ai.enabled=${CRM_AI_ENABLED:true}
crm.ai.provider=${CRM_AI_PROVIDER:HEURISTIC}
crm.ai.http-url=${CRM_AI_HTTP_URL:}
crm.ai.model-code=${CRM_AI_MODEL_CODE:HEURISTIC_V1}
