# Retail pilot profile — capture → score → quote → convert → audit export
# Run: mvn spring-boot:run "-Dspring-boot.run.profiles=local,pilot-retail"

spring.config.activate.on-profile=pilot-retail

# Entitlements: assign crm-starter / professional / enterprise to the tenant org first.
crm.entitlement.enabled=${CRM_ENTITLEMENT_ENABLED:true}
crm.entitlement.base-url=${CRM_SUBSCRIPTION_BASE_URL:http://localhost:8182}
crm.entitlement.flag=FEATURE_CRM
crm.entitlement.fail-open=${CRM_ENTITLEMENT_FAIL_OPEN:false}
crm.entitlement.quote-flag=FEATURE_CRM_QUOTE
crm.entitlement.campaign-flag=FEATURE_CRM_CAMPAIGN
crm.entitlement.ai-flag=FEATURE_CRM_AI
crm.entitlement.sequences-flag=FEATURE_CRM_SEQUENCES
crm.entitlement.whatsapp-flag=FEATURE_CRM_WHATSAPP
crm.entitlement.sms-flag=FEATURE_CRM_SMS
crm.entitlement.email-flag=FEATURE_CRM_EMAIL
crm.entitlement.approval-flag=FEATURE_CRM_APPROVAL
crm.entitlement.automation-flag=FEATURE_CRM_AUTOMATION
crm.entitlement.api-flag=FEATURE_CRM_API
crm.entitlement.cases-flag=FEATURE_CRM_CASES

# Notifications opt-in for quote send / sequences
crm.notification.enabled=${CRM_NOTIFICATION_ENABLED:true}
crm.notification.base-url=${CRM_NOTIFICATION_BASE_URL:http://localhost:8087}
crm.notification.fail-open=true
crm.notification.quote-whatsapp-template=CRM_QUOTE_WHATSAPP
crm.notification.quote-email-template=CRM_QUOTE_EMAIL
crm.notification.quote-sms-template=CRM_QUOTE_SMS
crm.notification.sequence-step-template=CRM_SEQ_STEP

# Live quote→order (optional): set CRM_ORDER_ENABLED=true + numeric shop/customer/product ids
crm.order.enabled=${CRM_ORDER_ENABLED:false}
crm.order.fail-open=true
crm.order.base-url=${CRM_ORDER_BASE_URL:http://localhost:8083}
crm.order.shop-id=${CRM_ORDER_SHOP_ID:}
crm.order.default-customer-id=${CRM_ORDER_DEFAULT_CUSTOMER_ID:}
crm.order.default-product-id=${CRM_ORDER_DEFAULT_PRODUCT_ID:}
crm.order.internal-api-key=${CRM_ORDER_INTERNAL_API_KEY:${CRM_CONVERT_INTERNAL_API_KEY:}}

# Optional School rule-engine evaluate on stage change
crm.rule-engine.enabled=${CRM_RULE_ENGINE_ENABLED:false}
crm.rule-engine.fail-open=true
crm.rule-engine.base-url=${CRM_RULE_ENGINE_BASE_URL:http://localhost:8092}

# Field Force visit deep-link / embed
crm.field-force.embed-enabled=${CRM_FF_EMBED_ENABLED:true}
crm.field-force.visit-url-template=${CRM_FF_VISIT_URL:http://localhost:4300/visits?leadId={{leadId}}}
crm.field-force.open-in-new-tab=${CRM_FF_OPEN_NEW_TAB:true}

# Convert enabled — default to local CRM sinks; override env to hit live ERP adapters.
# SHOP_CUSTOMER live = user-service (Retail customers), NOT shop-service:
#   CRM_CONVERT_SHOP_URL=http://localhost:8084/api/v1/customers/from-crm
#   CRM_CONVERT_SHOP_ID=<numeric shop org id>   # when CRM X-Tenant-Id is not numeric
# SCHOOL_INQUIRY has no from-crm receiver in-repo yet — keep sink or wire school inquiry API.
crm.convert.enabled=${CRM_CONVERT_ENABLED:true}
crm.convert.fail-open=${CRM_CONVERT_FAIL_OPEN:true}
crm.convert.shop-id=${CRM_CONVERT_SHOP_ID:}
crm.convert.internal-api-key=${CRM_CONVERT_INTERNAL_API_KEY:}
crm.convert.shop-customer-url=${CRM_CONVERT_SHOP_URL:http://localhost:8095/api/v1/crm/adapters/erp/SHOP_CUSTOMER}
crm.convert.school-inquiry-url=${CRM_CONVERT_SCHOOL_URL:http://localhost:8095/api/v1/crm/adapters/erp/SCHOOL_INQUIRY}
crm.convert.field-force-url=${CRM_CONVERT_FF_URL:http://localhost:8095/api/v1/crm/adapters/erp/FIELD_FORCE}

# Optional LLM bridge (leave HEURISTIC unless CRM_AI_HTTP_URL is set)
crm.ai.enabled=true
crm.ai.provider=${CRM_AI_PROVIDER:HEURISTIC}
crm.ai.http-url=${CRM_AI_HTTP_URL:}
crm.ai.model-code=${CRM_AI_MODEL_CODE:HEURISTIC_V1}

crm.pilot.vertical=RETAIL
